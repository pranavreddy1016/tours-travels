<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tour Booking</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background-color: #f5f5f5;

        }


        .booking-box {

            width: 450px;

            max-width: 90%;

            background-color: white;

            margin: 50px auto;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

        }


        h1 {

            text-align: center;

            color: #e91e63;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 5px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background-color: #25D366;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }


        button:hover {

            background-color: #1da851;

        }
.navbar {
    display: flex;
    list-style: none;
    gap: 20px;
    border-radius: 20px;
    padding:10px;


}
.navbar li {
    position: relative;
}

.navbar a {
    text-decoration: none;
    color: black;
}
        
    </style>

</head>


<body>
    <nav>
        <ul class="navbar">
            <li>
<a href="hunneymoom.html">Back</a>
            </li>
        </ul>
    </nav>


    <div class="booking-box">

        <h1>Tour Booking</h1>


        <form id="bookingForm">


            <!-- Tour -->

            <label>Selected Tour</label>

            <input
                type="text"
                id="tour"
                readonly
            >


            <!-- Name -->

            <label>Your Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <!-- Mobile -->

            <label>Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                required
            >


            <!-- Date -->

            <label>Travel Date</label>

            <input
                type="date"
                id="date"
                required
            >


            <!-- Persons -->

            <label>Number of Persons</label>

            <input
                type="number"
                id="persons"
                min="1"
                placeholder="Enter number of persons"
                required
            >


            <!-- Submit -->

            <button type="submit">

                Submit Booking

            </button>


        </form>

    </div>



    <script>


        // URL se tour name lena

        const urlParams =
            new URLSearchParams(window.location.search);


        const tourName =
            urlParams.get("tour");


        // Tour input mein show karna

        document.getElementById("tour").value =
            tourName;



        // Form submit

        document
            .getElementById("bookingForm")
            .addEventListener("submit", function(event) {


                // Page reload hone se rokna

                event.preventDefault();


                // Form values

                const name =
                    document.getElementById("name").value;

                const mobile =
                    document.getElementById("mobile").value;

                const date =
                    document.getElementById("date").value;

                const persons =
                    document.getElementById("persons").value;



                // Apna WhatsApp number yaha dale

                const whatsappNumber =
                    "7709174049";



                // WhatsApp message

                const message =

                    "*NEW TOUR BOOKING* \n\n" +

                    "Tour: " + tourName + "\n" +

                    "Name: " + name + "\n" +

                    "Mobile: " + mobile + "\n" +

                    "Travel Date: " + date + "\n" +

                    "Persons: " + persons;



                // WhatsApp URL

                const whatsappURL =

                    "https://wa.me/" +

                    whatsappNumber +

                    "?text=" +

                    encodeURIComponent(message);



                // WhatsApp open

                window.open(
                    whatsappURL,
                    "_blank"
                );


            });

    </script>


</body>

</html>
